<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODAURA | New York House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@200;300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #ffffff; color: #000; margin: 0; -webkit-font-smoothing: antialiased; }
        .font-luxury { font-family: 'Bodoni Moda', serif; }
        .logo-main { font-family: 'Bodoni Moda', serif; font-style: italic; color: #AD1457; font-weight: 700; letter-spacing: -1.5px; }
        
        /* NYC Grid */
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding: 40px; max-width: 1500px; margin: 0 auto; }
        @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .product-grid { grid-template-columns: 1fr; padding: 24px; } }

        .img-container { aspect-ratio: 3/4; overflow: hidden; background: #fafafa; position: relative; box-shadow: 0 10px 30px -15px rgba(0,0,0,0.1); }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.5s; }
        .product-card:hover img { transform: scale(1.03); }

        .btn-nyc { background: #000; color: #fff; padding: 22px; font-size: 11px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; width: 100%; display: block; text-align: center; border: none; cursor: pointer; }
        #adminPanel { background: #ffffff !important; z-index: 9999; position: fixed; inset: 0; overflow-y: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-gray-50 z-[500] px-8 py-6 flex justify-between items-center">
        <div onclick="goHome()" class="cursor-pointer">
            <h1 class="text-4xl logo-main">Modaura</h1>
            <p class="text-[8px] tracking-[0.6em] text-gray-400 font-bold uppercase mt-1">New York • Paris • London</p>
        </div>
        <div class="flex gap-12">
            <button onclick="toggleAdmin()" class="text-[9px] tracking-widest text-gray-300 uppercase hover:text-black">Studio</button>
            <button onclick="goHome()" class="text-[10px] tracking-widest font-bold uppercase border-b-2 border-black pb-1">Collection</button>
        </div>
    </nav>

    <main>
        <div id="homeView">
            <header class="text-center py-32 px-6">
                <div class="text-[10px] tracking-[0.5em] uppercase mb-8 text-gray-400 font-bold">Limited NYC Collection</div>
                <h2 class="text-7xl font-luxury italic mb-8">Vibrant Elegance</h2>
                <p class="text-[12px] tracking-[0.4em] text-gray-400 uppercase italic">Curating the Manhattan Aesthetic.</p>
            </header>
            
            <div id="noDataMessage" class="hidden text-center py-20">
                <p class="text-red-400 text-xs uppercase tracking-widest mb-4">Connection Notice</p>
                <p class="text-gray-400 text-sm italic">Data found in Upstash but not reaching UI. Checking API...</p>
            </div>

            <div id="productGrid" class="product-grid"></div>
        </div>

        <div id="detailView" class="hidden p-8 md:p-24 max-w-[1500px] mx-auto">
            <div class="flex flex-col lg:flex-row gap-20">
                <div class="w-full lg:w-3/5 flex gap-6">
                    <div id="thumbContainer" class="flex flex-col gap-4"></div>
                    <div class="flex-1 img-container">
                        <img id="mainDetailImg" src="" class="w-full h-full object-cover">
                    </div>
                </div>
                <div class="w-full lg:w-2/5 flex flex-col justify-center">
                    <p id="detailCat" class="text-[#AD1457] text-[10px] font-bold tracking-[0.5em] uppercase mb-6 italic"></p>
                    <h2 id="detailTitle" class="text-6xl font-luxury italic mb-8"></h2>
                    <p id="detailPrice" class="text-3xl font-light text-gray-800 mb-10"></p>
                    <div class="border-t border-b border-gray-50 py-12 mb-10">
                        <ul id="detailBullets" class="text-[16px] text-gray-500 space-y-5 italic"></ul>
                    </div>
                    <a id="detailLink" href="#" target="_blank" class="btn-nyc">Acquire on Amazon</a>
                    <button onclick="goHome()" class="mt-12 text-[10px] text-gray-400 uppercase tracking-widest hover:text-black">← Back</button>
                </div>
            </div>
        </div>

        <div id="adminPanel" class="hidden p-10">
            <div class="max-w-2xl mx-auto bg-white p-12 shadow-2xl mt-10 border">
                <div class="flex justify-between items-center mb-10 border-b pb-6">
                    <h3 class="font-luxury text-3xl italic">Studio Inventory</h3>
                    <button onclick="document.getElementById('adminPanel').classList.add('hidden')" class="text-3xl">&times;</button>
                </div>
                <div class="grid gap-6">
                    <input type="text" id="dressName" placeholder="Piece Title" class="border-b p-3 outline-none w-full">
                    <input type="number" id="dressPrice" placeholder="Price (USD)" class="border-b p-3 outline-none w-full">
                    <input type="text" id="dressCategory" placeholder="Category" class="border-b p-3 outline-none w-full">
                    <input type="text" id="amazonLink" placeholder="Amazon Link" class="border-b p-3 outline-none w-full">
                    <input type="text" id="img1" placeholder="Main Image URL" class="border-b p-3 outline-none w-full text-sm">
                    <input type="text" id="img2" placeholder="Second Image URL" class="border-b p-3 outline-none w-full text-sm">
                    <input type="text" id="img3" placeholder="Third Image URL" class="border-b p-3 outline-none w-full text-sm">
                    <textarea id="dressDesc" placeholder="Description (Comma separated)" class="border p-4 h-32 outline-none text-sm italic w-full"></textarea>
                    <button onclick="saveDress()" id="saveBtn" class="btn-nyc py-5">Publish</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let allProducts = [];

        async function fetchProducts() {
            try { 
                const res = await fetch('/api/get-dresses'); 
                const rawResponse = await res.json();
                
                // DATA REPAIR ENGINE: Handle Upstash List Wrapper
                let finalData = [];
                if (Array.isArray(rawResponse)) {
                    finalData = rawResponse;
                } else if (rawResponse.result && Array.isArray(rawResponse.result)) {
                    finalData = rawResponse.result;
                }

                // Deep Parsing for Strings
                return finalData.map(item => {
                    if (typeof item === 'string') {
                        try { return JSON.parse(item); } catch(e) { return null; }
                    }
                    return item;
                }).filter(i => i && i.images && i.images.length > 0);

            } catch (e) { 
                console.error("Fetch Error:", e);
                return []; 
            }
        }

        async function saveDress() {
            const btn = document.getElementById('saveBtn'); btn.innerText = "AUTHENTICATING...";
            const data = {
                name: document.getElementById('dressName').value,
                price: document.getElementById('dressPrice').value,
                category: document.getElementById('dressCategory').value,
                images: [document.getElementById('img1').value, document.getElementById('img2').value, document.getElementById('img3').value].filter(u => u),
                link: document.getElementById('amazonLink').value,
                desc: document.getElementById('dressDesc').value,
                id: Date.now()
            };
            await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            window.location.reload();
        }

        function toggleAdmin() { if (prompt("Key:") === "rafay1259") document.getElementById('adminPanel').classList.remove('hidden'); }
        function swapImg(src) { document.getElementById('mainDetailImg').src = src; }

        async function init() {
            allProducts = await fetchProducts();
            if (!allProducts || allProducts.length === 0) {
                document.getElementById('noDataMessage').classList.remove('hidden');
            } else {
                renderGrid(allProducts);
            }
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) showDetails(id);
        }

        function renderGrid(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(item => `
                <div class="product-card" onclick='updateUrlAndShow(${item.id})'>
                    <div class="img-container mb-10"><img src="${item.images[0]}" loading="lazy"></div>
                    <div class="text-center px-4">
                        <p class="text-[10px] tracking-[0.4em] text-[#AD1457] font-bold uppercase mb-4 italic">${item.category}</p>
                        <h3 class="text-[14px] font-bold tracking-[0.1em] text-gray-900 mb-3 uppercase">${item.name}</h3>
                        <p class="font-luxury italic text-2xl text-gray-400">$${item.price}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateUrlAndShow(id) { window.history.pushState({}, '', `?id=${id}`); showDetails(id); }

        function showDetails(id) {
            const p = allProducts.find(item => item.id == id); if(!p) return;
            document.getElementById('mainDetailImg').src = p.images[0];
            document.getElementById('detailTitle').innerText = p.name;
            document.getElementById('detailPrice').innerText = `$${p.price}`;
            document.getElementById('detailCat').innerText = p.category;
            document.getElementById('detailLink').href = p.link;
            document.getElementById('detailBullets').innerHTML = (p.desc || "").split(',').map(b => `<li>— ${b.trim()}</li>`).join('');
            document.getElementById('thumbContainer').innerHTML = p.images.map(img => `<img src="${img}" onclick="swapImg(this.src)" class="w-16 md:w-24 border border-gray-100 cursor-pointer hover:border-black aspect-[3/4] object-cover">`).join('');
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function goHome() { window.history.pushState({}, '', window.location.pathname); document.getElementById('homeView').classList.remove('hidden'); document.getElementById('detailView').classList.add('hidden'); init(); }
        init();
    </script>
</body>
    </html>
