<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modaura | New York • Paris</title>
    <meta name="p:domain_verify" content="8f77429b5d097004d2a19de3d10f52ba"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #FFF; color: #111; }
        .font-luxury { font-family: 'Bodoni Moda', serif; }
        .amazon-btn { background: #111; color: white; border-radius: 2px; transition: 0.3s; cursor: pointer; }
        .amazon-btn:hover { background: #333; letter-spacing: 1px; }
        .hidden { display: none; }
        .nav-link { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; color: #999; }
        .nav-link:hover { color: #AD1457; }
    </style>
</head>
<body>

    <nav class="p-6 md:p-10 flex justify-between items-center bg-white sticky top-0 z-50 border-b border-gray-50">
        <div onclick="goHome()" class="cursor-pointer">
            <h1 class="text-xl md:text-2xl font-luxury italic tracking-tighter text-[#AD1457]">MODAURA</h1>
            <p class="text-[7px] tracking-[0.4em] text-gray-400 -mt-1">NEW YORK • PARIS</p>
        </div>
        
        <div class="flex gap-8 items-center">
            <button onclick="toggleAdmin()" class="nav-link">Studio</button>
            <button onclick="goHome()" class="nav-link text-pink-700">Gallery</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        
        <div id="adminPanel" class="hidden max-w-lg mx-auto mb-20 p-10 bg-gray-50 rounded-sm border border-gray-100">
            <h3 class="font-luxury italic text-2xl mb-8">Inventory Manager</h3>
            <div class="space-y-4">
                <input type="text" id="dressName" placeholder="Product Title" class="w-full p-4 text-xs border-none outline-none">
                <input type="number" id="dressPrice" placeholder="Price ($)" class="w-full p-4 text-xs border-none outline-none">
                <input type="text" id="dressCategory" placeholder="Category" class="w-full p-4 text-xs border-none outline-none">
                <input type="text" id="dressImage1" placeholder="Main Image URL" class="w-full p-4 text-xs border-none outline-none">
                <input type="text" id="dressImage2" placeholder="Image 2 URL" class="w-full p-4 text-xs border-none outline-none">
                <input type="text" id="dressImage3" placeholder="Image 3 URL" class="w-full p-4 text-xs border-none outline-none">
                <input type="text" id="amazonLink" placeholder="Amazon Affiliate Link" class="w-full p-4 text-xs border-none outline-none">
                <textarea id="dressDesc" placeholder="Product Details (comma separated)..." class="w-full p-4 text-xs border-none outline-none h-24"></textarea>
                <button onclick="saveDress()" class="w-full bg-black text-white py-4 text-[10px] font-bold uppercase tracking-widest">Publish Piece</button>
            </div>
        </div>

        <div id="homeView">
            <div class="text-center mb-24">
                <h2 class="text-5xl md:text-7xl font-luxury italic mb-4">Vibrant Elegance</h2>
                <p class="text-[9px] tracking-[0.5em] text-gray-400 uppercase font-light">Defining the Modern Silhouette</p>
            </div>
            <div id="productGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-12"></div>
        </div>

        <div id="detailView" class="hidden">
            <div class="flex flex-col lg:flex-row gap-16">
                <div class="w-full lg:w-3/5 flex gap-4">
                    <div class="flex flex-col gap-3">
                        <img id="thumb1" onclick="swapImg(this.src)" class="w-16 h-20 object-cover cursor-pointer hover:opacity-50 transition border">
                        <img id="thumb2" onclick="swapImg(this.src)" class="w-16 h-20 object-cover cursor-pointer hover:opacity-50 transition border">
                        <img id="thumb3" onclick="swapImg(this.src)" class="w-16 h-20 object-cover cursor-pointer hover:opacity-50 transition border">
                    </div>
                    <img id="mainDetailImg" src="" class="flex-1 object-cover aspect-[3/4] shadow-sm">
                </div>
                <div class="w-full lg:w-2/5 pt-10">
                    <p id="detailCat" class="text-[9px] tracking-[0.3em] text-pink-600 font-bold mb-4 uppercase"></p>
                    <h2 id="detailTitle" class="text-4xl font-luxury mb-6"></h2>
                    <p id="detailPrice" class="text-2xl font-light mb-10 text-gray-900"></p>
                    <div class="mb-12">
                        <ul id="detailBullets" class="text-xs text-gray-500 space-y-3 italic leading-relaxed"></ul>
                    </div>
                    <a id="detailLink" href="#" target="_blank" class="amazon-btn w-full py-5 text-center block text-[10px] font-bold uppercase tracking-[3px]">Acquire Piece</a>
                    <button onclick="goHome()" class="mt-10 text-[8px] text-gray-300 uppercase tracking-widest hover:text-black transition">← Return to Collection</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-40 py-20 border-t border-gray-50 text-center">
        <div class="flex justify-center gap-12 mb-10">
            <a href="https://www.tiktok.com/@modaura.pk" target="_blank" class="text-[9px] font-bold tracking-[0.3em] text-gray-300 hover:text-black">TIKTOK</a>
            <a href="https://www.pinterest.com/Modaura_Official/" target="_blank" class="text-[9px] font-bold tracking-[0.3em] text-gray-300 hover:text-black">PINTEREST</a>
        </div>
        <p class="text-[8px] text-gray-300 italic max-w-xl mx-auto px-6 mb-4">
            *Disclosure: As an Amazon Associate, Modaura earns from qualifying purchases.
        </p>
        <p class="text-[8px] tracking-widest text-gray-200 uppercase">© 2026 Modaura Luxury Boutique</p>
    </footer>

    <script>
        const UPSTASH_URL = "https://humorous-walrus-45015.upstash.io";
        const UPSTASH_TOKEN = "Aa_XAAIncDJkZDNmYTRkZjY3YTg0YWM4OTYzMWYzYWIxNTE4ZTJlYnAyNDUwMTU";
        const KEYS_TO_CHECK = ["modaura_final_v3", "modaura_final_v2"]; // Preserving multi-key search

        let allProducts = [];

        async function getProducts() {
            for (let key of KEYS_TO_CHECK) {
                try {
                    const response = await fetch(`${UPSTASH_URL}/hgetall/${key}`, {
                        headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` }
                    });
                    const data = await response.json();
                    if (data.result && data.result.length > 0) {
                        let products = [];
                        for (let i = 1; i < data.result.length; i += 2) {
                            products.push(JSON.parse(data.result[i]));
                        }
                        return products;
                    }
                } catch (e) { console.log("Key skip"); }
            }
            return [];
        }

        async function saveDress() {
            const data = {
                name: document.getElementById('dressName').value,
                price: document.getElementById('dressPrice').value,
                category: document.getElementById('dressCategory').value,
                images: [document.getElementById('dressImage1').value, document.getElementById('dressImage2').value, document.getElementById('dressImage3').value],
                link: document.getElementById('amazonLink').value,
                desc: document.getElementById('dressDesc').value,
                id: Date.now()
            };
            await fetch(`${UPSTASH_URL}/hset/${KEYS_TO_CHECK[0]}`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` },
                body: JSON.stringify([data.id, JSON.stringify(data)])
            });
            window.location.reload();
        }

        function toggleAdmin() { if (prompt("Key:") === "rafay1259") document.getElementById('adminPanel').classList.toggle('hidden'); }
        function swapImg(src) { if(src) document.getElementById('mainDetailImg').src = src; }

        async function init() {
            allProducts = await getProducts();
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (productId) { showDetails(productId); } else { renderGrid(allProducts); }
        }

        function renderGrid(products) {
            const grid = document.getElementById('productGrid');
            if (products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-20 text-gray-300 italic">Collection is being curated...</p>`;
                return;
            }
            grid.innerHTML = products.map(item => `
                <div class="cursor-pointer group" onclick='updateUrlAndShow(${item.id})'>
                    <div class="aspect-[3/4] mb-6 overflow-hidden bg-gray-50">
                        <img src="${item.images[0]}" class="w-full h-full object-cover transition duration-700 group-hover:scale-105">
                    </div>
                    <h3 class="text-[9px] font-bold tracking-widest text-gray-400 mb-2 uppercase">${item.name}</h3>
                    <p class="font-luxury text-xl">$${item.price}</p>
                </div>
            `).join('');
        }

        function updateUrlAndShow(id) {
            window.history.pushState({}, '', `?id=${id}`);
            showDetails(id);
        }

        function showDetails(id) {
            const p = allProducts.find(item => item.id == id);
            if(!p) return;
            document.getElementById('mainDetailImg').src = p.images[0];
            document.getElementById('thumb1').src = p.images[0];
            document.getElementById('thumb2').src = p.images[1] || p.images[0];
            document.getElementById('thumb3').src = p.images[2] || p.images[0];
            document.getElementById('detailTitle').innerText = p.name;
            document.getElementById('detailPrice').innerText = `$${p.price}`;
            document.getElementById('detailCat').innerText = p.category;
            document.getElementById('detailLink').href = p.link;
            document.getElementById('detailBullets').innerHTML = p.desc.split(',').map(b => `<li>• ${b.trim()}</li>`).join('');
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function goHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
            renderGrid(allProducts);
        }
        init();
    </script>
</body>
            </html>
