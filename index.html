<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modaura | New York Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #111; color: #fff; overflow-x: hidden; margin: 0; }
        .font-luxury { font-family: 'Bodoni Moda', serif; }
        .hidden { display: none; }
        
        /* Desktop Grid - 3 Columns (Aapki demand ke mutabiq) */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 40px; 
            padding: 40px 0;
        }

        /* Responsive Breakpoints (Android Desktop mode fix) */
        @media (max-width: 1024px) { 
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; } 
            .hero-title { font-size: 4rem !important; }
        }
        @media (max-width: 640px) { 
            .product-grid { grid-template-columns: 1fr; } 
            .hero-title { font-size: 3rem !important; }
            main { padding-left: 15px !important; padding-right: 15px !important; }
        }

        .amazon-btn { background: #fff; color: #111; border-radius: 0px; transition: 0.4s; cursor: pointer; border: 1px solid #fff; text-align: center; }
        .amazon-btn:hover { background: transparent; color: #fff; }
        
        .nav-link { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; color: #666; transition: 0.3s; }
        .nav-link:hover { color: #AD1457; }
        
        .img-wrapper { aspect-ratio: 3/4; overflow: hidden; background: #222; position: relative; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover img { transform: scale(1.05); }

        .thumb-img { width: 70px; aspect-ratio: 3/4; object-fit: cover; cursor: pointer; border: 1px solid #333; transition: 0.3s; }
        .thumb-img:hover { border-color: #AD1457; }
    </style>
</head>
<body>

    <nav class="py-8 px-6 md:px-20 flex justify-between items-center bg-[#111] sticky top-0 z-50 border-b border-white/5">
        <div onclick="goHome()" class="cursor-pointer">
            <h1 class="text-2xl font-luxury italic text-white leading-none">MODA<span class="text-[#AD1457]">URA</span></h1>
            <p class="text-[8px] tracking-[0.4em] text-gray-500 font-bold uppercase">New York • Paris</p>
        </div>
        
        <div class="flex gap-6 md:gap-12 items-center">
            <button onclick="toggleAdmin()" class="nav-link">Studio</button>
            <button onclick="goHome()" class="nav-link text-white border-b border-white pb-1">Boutique</button>
        </div>
    </nav>

    <main class="max-w-[1300px] mx-auto px-8 py-12">
        
        <div id="adminPanel" class="hidden max-w-2xl mx-auto mb-20 p-10 bg-[#1a1a1a] border border-white/10 shadow-2xl">
            <h3 class="font-luxury italic text-3xl mb-8 text-center text-white">Inventory Studio</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <input type="text" id="dressName" placeholder="Product Title" class="p-4 text-xs bg-black border border-white/10 outline-none text-white">
                <input type="number" id="dressPrice" placeholder="Price ($)" class="p-4 text-xs bg-black border border-white/10 outline-none text-white">
                <input type="text" id="dressCategory" placeholder="Category" class="p-4 text-xs bg-black border border-white/10 outline-none text-white">
                <input type="text" id="amazonLink" placeholder="Amazon Link" class="p-4 text-xs bg-black border border-white/10 outline-none text-white">
                <input type="text" id="img1" placeholder="Image 1 (Main URL)" class="col-span-full p-4 text-xs bg-black border border-white/10 outline-none text-white">
                <input type="text" id="img2" placeholder="Image 2 URL" class="p-4 text-xs bg-black border border-white/10 outline-none text-white">
                <input type="text" id="img3" placeholder="Image 3 URL" class="p-4 text-xs bg-black border border-white/10 outline-none text-white">
                <textarea id="dressDesc" placeholder="Description (Point 1, Point 2...)" class="col-span-full p-4 text-xs bg-black border border-white/10 outline-none h-28 text-white"></textarea>
                <button onclick="saveDress()" id="saveBtn" class="col-span-full amazon-btn py-5 font-bold uppercase tracking-[4px]">Publish Masterpiece</button>
            </div>
        </div>

        <div id="homeView">
            <div class="mb-16 border-b border-white/10 pb-10">
                <h2 class="hero-title text-7xl md:text-9xl font-luxury italic mb-4 leading-tight">Vibrant Elegance</h2>
                <div class="flex items-center gap-6">
                    <div class="h-[1px] w-20 bg-white/20"></div>
                    <p class="text-[10px] tracking-[0.6em] text-gray-500 uppercase">Spring Summer Collection 2026</p>
                </div>
            </div>
            
            <div id="productGrid" class="product-grid">
                <div class="col-span-full text-center py-20 border border-dashed border-white/10 text-gray-600 text-[10px] tracking-[0.3em] uppercase italic">
                    Connecting to Modaura-DB...
                </div>
            </div>
        </div>

        <div id="detailView" class="hidden">
            <div class="flex flex-col lg:flex-row gap-20">
                <div class="w-full lg:w-3/5 flex gap-5">
                    <div id="thumbContainer" class="flex flex-col gap-4"></div>
                    <div class="flex-1 bg-[#1a1a1a] shadow-2xl">
                        <img id="mainDetailImg" src="" class="w-full aspect-[3/4] object-cover">
                    </div>
                </div>
                <div class="w-full lg:w-2/5 flex flex-col justify-center">
                    <p id="detailCat" class="text-[#AD1457] font-bold text-[10px] tracking-widest uppercase mb-6"></p>
                    <h2 id="detailTitle" class="text-6xl font-luxury mb-8 italic leading-tight"></h2>
                    <p id="detailPrice" class="text-3xl font-light mb-12"></p>
                    <div class="border-y border-white/10 py-10 mb-12">
                        <ul id="detailBullets" class="text-sm text-gray-400 space-y-5 italic leading-relaxed"></ul>
                    </div>
                    <a id="detailLink" href="#" target="_blank" class="amazon-btn py-6 text-[11px] font-bold uppercase tracking-[5px]">Acquire Piece</a>
                    <button onclick="goHome()" class="mt-10 text-[9px] text-gray-600 hover:text-white transition tracking-widest uppercase">← Back to Boutique</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-40 py-20 border-t border-white/5 bg-[#0a0a0a] text-center">
        <div class="flex justify-center gap-16 mb-12 opacity-50">
            <a href="https://www.tiktok.com/@modaura.pk" target="_blank" class="nav-link text-white">TikTok</a>
            <a href="https://www.pinterest.com/Modaura_Official/" target="_blank" class="nav-link text-white">Pinterest</a>
        </div>
        <p class="text-[9px] text-gray-600 italic mb-4">*As an Amazon Associate, Modaura earns from qualifying purchases.</p>
        <p class="text-[9px] tracking-[0.8em] text-gray-500 uppercase">© 2026 MODAURA NEW YORK</p>
    </footer>

    <script>
        let allProducts = [];

        async function fetchProducts() {
            try {
                const res = await fetch('/api/get-dresses');
                const data = await res.json();
                return data || [];
            } catch (e) { return []; }
        }

        async function saveDress() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "UPLOADING...";
            const data = {
                name: document.getElementById('dressName').value,
                price: document.getElementById('dressPrice').value,
                category: document.getElementById('dressCategory').value,
                images: [
                    document.getElementById('img1').value,
                    document.getElementById('img2').value,
                    document.getElementById('img3').value
                ].filter(u => u),
                link: document.getElementById('amazonLink').value,
                desc: document.getElementById('dressDesc').value,
                id: Date.now()
            };
            await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            window.location.reload();
        }

        function toggleAdmin() { if (prompt("Key:") === "rafay1259") document.getElementById('adminPanel').classList.toggle('hidden'); }
        function swapImg(src) { document.getElementById('mainDetailImg').src = src; }

        async function init() {
            allProducts = await fetchProducts();
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (productId) { showDetails(productId); } else { renderGrid(allProducts); }
        }

        function renderGrid(products) {
            const grid = document.getElementById('productGrid');
            if (!products || products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-24 border border-dashed border-white/10 text-gray-500 text-[10px] tracking-widest uppercase italic">The Boutique is empty. Use Studio to add.</div>`;
                return;
            }
            grid.innerHTML = products.map(item => `
                <div class="cursor-pointer group" onclick='updateUrlAndShow(${item.id})'>
                    <div class="img-wrapper mb-6">
                        <img src="${item.images[0]}" loading="lazy">
                    </div>
                    <div class="text-left">
                        <p class="text-[9px] font-bold tracking-widest text-[#AD1457] mb-2 uppercase italic">${item.category}</p>
                        <h3 class="text-xs font-bold tracking-widest text-white mb-2 uppercase">${item.name}</h3>
                        <p class="font-luxury text-2xl text-gray-400 italic">$${item.price}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateUrlAndShow(id) {
            window.history.pushState({}, '', `?id=${id}`);
            showDetails(id);
        }

        function showDetails(id) {
            const p = allProducts.find(item => item.id == id);
            if(!p) return;
            document.getElementById('mainDetailImg').src = p.images[0];
            document.getElementById('detailTitle').innerText = p.name;
            document.getElementById('detailPrice').innerText = `$${p.price}`;
            document.getElementById('detailCat').innerText = p.category;
            document.getElementById('detailLink').href = p.link;
            document.getElementById('detailBullets').innerHTML = p.desc.split(',').map(b => `<li>— ${b.trim()}</li>`).join('');
            
            const thumbDiv = document.getElementById('thumbContainer');
            thumbDiv.innerHTML = p.images.map(img => `<img src="${img}" onclick="swapImg(this.src)" class="thumb-img">`).join('');
            
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function goHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
            renderGrid(allProducts);
        }
        init();
    </script>
</body>
                    </html>
