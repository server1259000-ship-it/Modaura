<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODAURA | Manhattan Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@200;300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #ffffff; color: #000; margin: 0; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .font-luxury { font-family: 'Bodoni Moda', serif; }
        .logo-main { font-family: 'Bodoni Moda', serif; font-style: italic; color: #AD1457; font-weight: 700; letter-spacing: -1.5px; }
        
        /* Premium NYC Layout */
        .hero-section { text-align: center; padding: 140px 24px 100px; }
        .hero-title { font-family: 'Bodoni Moda', serif; font-style: italic; font-size: clamp(3rem, 10vw, 5.5rem); line-height: 1; letter-spacing: -2px; }

        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding: 40px; max-width: 1500px; margin: 0 auto; }
        @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .product-grid { grid-template-columns: 1fr; padding: 24px; } }

        /* Auto-Quality Engine */
        .img-container { aspect-ratio: 3/4; overflow: hidden; background: #fafafa; position: relative; box-shadow: 0 10px 30px -15px rgba(0,0,0,0.08); }
        .img-container img { width: 100%; height: 100%; object-fit: cover; image-rendering: -webkit-optimize-contrast; transition: transform 1.5s cubic-bezier(0.2, 1, 0.3, 1); }
        .product-card:hover img { transform: scale(1.03); }

        .btn-nyc { background: #000; color: #fff; padding: 22px; font-size: 11px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; width: 100%; display: block; text-align: center; transition: 0.4s; border: none; cursor: pointer; }
        .btn-nyc:hover { background: #AD1457; transform: translateY(-2px); box-shadow: 0 15px 30px rgba(173, 20, 87, 0.15); }

        #adminPanel { background: #ffffff !important; z-index: 9999; position: fixed; inset: 0; overflow-y: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-gray-50 z-[500] px-8 py-6 flex justify-between items-center">
        <div onclick="goHome()" class="cursor-pointer">
            <h1 class="text-4xl logo-main">Modaura</h1>
            <p class="text-[8px] tracking-[0.6em] text-gray-400 font-bold uppercase mt-1">New York • Paris • London</p>
        </div>
        <div class="flex gap-12 items-center">
            <button onclick="toggleAdmin()" class="text-[9px] tracking-[0.3em] text-gray-300 uppercase hover:text-black">Studio</button>
            <button onclick="goHome()" class="text-[10px] tracking-[0.3em] font-bold uppercase border-b border-black pb-1">Collection</button>
        </div>
    </nav>

    <main>
        <div id="homeView">
            <header class="hero-section">
                <div class="text-[10px] tracking-[0.5em] uppercase mb-8 text-gray-400 font-bold">Limited NYC Flagship</div>
                <h2 class="hero-title mb-8">Vibrant Elegance</h2>
                <p class="text-[12px] tracking-[0.4em] text-gray-400 uppercase italic max-w-xl mx-auto leading-relaxed">Curating the Manhattan Silhouette.</p>
            </header>
            <div id="productGrid" class="product-grid"></div>
        </div>

        <div id="detailView" class="hidden p-8 md:p-24 max-w-[1500px] mx-auto">
            <div class="flex flex-col lg:flex-row gap-20">
                <div class="w-full lg:w-3/5 flex gap-6">
                    <div id="thumbContainer" class="flex flex-col gap-4"></div>
                    <div class="flex-1 img-container">
                        <img id="mainDetailImg" src="" class="w-full h-full object-cover">
                    </div>
                </div>
                <div class="w-full lg:w-2/5 flex flex-col justify-center">
                    <p id="detailCat" class="text-[#AD1457] text-[10px] font-bold tracking-[0.5em] uppercase mb-6 italic"></p>
                    <h2 id="detailTitle" class="text-6xl font-luxury italic mb-8 leading-[1.1]"></h2>
                    <p id="detailPrice" class="text-3xl font-light text-gray-800 tracking-tighter mb-10"></p>
                    <div class="border-t border-b border-gray-50 py-12 mb-10">
                        <ul id="detailBullets" class="text-[16px] text-gray-500 space-y-5 italic leading-relaxed"></ul>
                    </div>
                    <a id="detailLink" href="#" target="_blank" class="btn-nyc">Acquire via Amazon</a>
                    <button onclick="goHome()" class="mt-12 text-[10px] text-gray-400 uppercase tracking-widest hover:text-black">← Return to Collection</button>
                </div>
            </div>
        </div>

        <div id="adminPanel" class="hidden p-10 md:p-20">
            <div class="max-w-2xl mx-auto bg-white border border-gray-100 p-12 md:p-20 shadow-2xl mt-10">
                <div class="flex justify-between items-center mb-16 border-b pb-10">
                    <h3 class="font-luxury text-4xl italic">Studio Inventory</h3>
                    <button onclick="document.getElementById('adminPanel').classList.add('hidden')" class="text-4xl">&times;</button>
                </div>
                <div class="grid gap-8">
                    <input type="text" id="dressName" placeholder="Piece Name" class="border-b p-4 outline-none w-full italic">
                    <input type="number" id="dressPrice" placeholder="Price (USD)" class="border-b p-4 outline-none w-full">
                    <input type="text" id="dressCategory" placeholder="Category" class="border-b p-4 outline-none w-full uppercase text-xs tracking-widest">
                    <input type="text" id="amazonLink" placeholder="Amazon Link" class="border-b p-4 outline-none w-full">
                    <input type="text" id="img1" placeholder="Main Image URL" class="border-b p-4 outline-none w-full text-sm">
                    <input type="text" id="img2" placeholder="Second Image URL" class="border-b p-4 outline-none w-full text-sm">
                    <input type="text" id="img3" placeholder="Third Image URL" class="border-b p-4 outline-none w-full text-sm">
                    <textarea id="dressDesc" placeholder="Points (Comma separated)" class="border p-6 h-40 outline-none text-sm italic w-full"></textarea>
                    <button onclick="saveDress()" id="saveBtn" class="btn-nyc py-6">Publish to Boutique</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-40 py-24 border-t border-gray-50 bg-[#fafafa] text-center px-10">
        <p class="text-[10px] text-gray-400 italic mb-6 max-w-sm mx-auto">Modaura is a participant in the Amazon Services LLC Associates Program.</p>
        <p class="text-[9px] tracking-[0.8em] text-gray-300 uppercase">© 2026 MODAURA NEW YORK HOUSE</p>
    </footer>

    <script>
        let allProducts = [];

        async function fetchProducts() {
            try { 
                const res = await fetch('/api/get-dresses?cache_bust=' + Date.now()); 
                const data = await res.json();
                
                // DATA RECOVERY LOGIC: Check all possible Upstash formats
                let rawList = Array.isArray(data) ? data : (data.result || []);
                
                return rawList.map(item => {
                    if (typeof item === 'string') {
                        try { return JSON.parse(item); } catch(e) { return null; }
                    }
                    return item;
                }).filter(i => i !== null && i.images);

            } catch (e) { 
                console.error("Fetch failed:", e);
                return []; 
            }
        }

        async function saveDress() {
            const btn = document.getElementById('saveBtn'); btn.innerText = "PUBLISHING...";
            const data = {
                name: document.getElementById('dressName').value,
                price: document.getElementById('dressPrice').value,
                category: document.getElementById('dressCategory').value,
                images: [document.getElementById('img1').value, document.getElementById('img2').value, document.getElementById('img3').value].filter(u => u),
                link: document.getElementById('amazonLink').value,
                desc: document.getElementById('dressDesc').value,
                id: Date.now()
            };
            if(!data.name || !data.images[0]) { alert("Required fields missing!"); btn.innerText="Publish"; return; }
            await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            window.location.reload();
        }

        function toggleAdmin() { if (prompt("Master Key:") === "rafay1259") document.getElementById('adminPanel').classList.remove('hidden'); }
        function swapImg(src) { document.getElementById('mainDetailImg').src = src; }

        async function init() {
            allProducts = await fetchProducts();
            console.log("Validated Products:", allProducts);
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) showDetails(id); else renderGrid(allProducts);
        }

        function renderGrid(products) {
            const grid = document.getElementById('productGrid');
            if (!products || products.length === 0) { 
                grid.innerHTML = `<div class="col-span-full py-40 text-center text-gray-300 uppercase text-[10px] tracking-[0.5em] italic">Curating New Arrivals in Manhattan...</div>`; 
                return; 
            }
            grid.innerHTML = products.map(item => `
                <div class="product-card" onclick='updateUrlAndShow(${item.id})'>
                    <div class="img-container mb-10"><img src="${item.images[0]}" loading="lazy"></div>
                    <div class="text-center px-4">
                        <p class="text-[10px] tracking-[0.4em] text-[#AD1457] font-bold uppercase mb-4">${item.category || 'Collection'}</p>
                        <h3 class="text-[14px] font-bold tracking-[0.1em] text-gray-900 mb-3 uppercase">${item.name}</h3>
                        <p class="font-luxury italic text-2xl text-gray-400">$${item.price}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateUrlAndShow(id) { window.history.pushState({}, '', `?id=${id}`); showDetails(id); }

        function showDetails(id) {
            const p = allProducts.find(item => item.id == id); if(!p) return;
            document.getElementById('mainDetailImg').src = p.images[0];
            document.getElementById('detailTitle').innerText = p.name;
            document.getElementById('detailPrice').innerText = `$${p.price}`;
            document.getElementById('detailCat').innerText = p.category;
            document.getElementById('detailLink').href = p.link;
            document.getElementById('detailBullets').innerHTML = (p.desc || "").split(',').map(b => `<li>— ${b.trim()}</li>`).join('');
            document.getElementById('thumbContainer').innerHTML = p.images.map(img => `<img src="${img}" onclick="swapImg(this.src)" class="w-16 md:w-24 border border-gray-100 cursor-pointer hover:border-black transition aspect-[3/4] object-cover">`).join('');
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function goHome() { window.history.pushState({}, '', window.location.pathname); document.getElementById('homeView').classList.remove('hidden'); document.getElementById('detailView').classList.add('hidden'); renderGrid(allProducts); }
        init();
    </script>
</body>
    </html>
