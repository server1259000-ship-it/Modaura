<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modaura | New York Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #FFF; color: #111; overflow-x: hidden; }
        .font-luxury { font-family: 'Bodoni Moda', serif; }
        
        /* Desktop Optimized Grid - 3 per row fixed */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 40px; 
            padding: 40px 0;
        }

        @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .product-grid { grid-template-columns: 1fr; } }

        .amazon-btn { background: #111; color: white; border-radius: 0px; transition: 0.4s; cursor: pointer; border: 1px solid #111; text-align: center; }
        .amazon-btn:hover { background: transparent; color: #111; }
        
        .nav-link { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; color: #999; transition: 0.3s; }
        .nav-link:hover { color: #AD1457; }
        
        .hidden { display: none; }
        
        .img-wrapper { aspect-ratio: 3/4; overflow: hidden; background: #f9f9f9; position: relative; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
        .product-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body>

    <nav class="py-8 px-12 md:px-24 flex justify-between items-center bg-white sticky top-0 z-50 border-b border-gray-50">
        <div onclick="goHome()" class="cursor-pointer">
            <h1 class="text-2xl font-luxury italic tracking-tighter text-[#AD1457]">MODAURA</h1>
            <p class="text-[8px] tracking-[0.5em] text-gray-400 font-bold uppercase">New York • Paris</p>
        </div>
        
        <div class="flex gap-10 items-center">
            <button onclick="toggleAdmin()" class="nav-link">Studio</button>
            <button onclick="goHome()" class="nav-link text-black border-b border-black">Boutique</button>
        </div>
    </nav>

    <main class="max-w-[1200px] mx-auto px-6 py-10">
        
        <div id="adminPanel" class="hidden max-w-xl mx-auto mb-20 p-10 bg-gray-50 border border-gray-100 shadow-sm">
            <h3 class="font-luxury italic text-2xl mb-8 text-center">Inventory Studio</h3>
            <div class="space-y-4">
                <input type="text" id="dressName" placeholder="Product Title" class="w-full p-4 text-xs border outline-none">
                <input type="number" id="dressPrice" placeholder="Price ($)" class="w-full p-4 text-xs border outline-none">
                <input type="text" id="dressCategory" placeholder="Category" class="w-full p-4 text-xs border outline-none">
                <input type="text" id="dressImage" placeholder="Main Image URL" class="w-full p-4 text-xs border outline-none">
                <input type="text" id="amazonLink" placeholder="Amazon Link" class="w-full p-4 text-xs border outline-none">
                <textarea id="dressDesc" placeholder="Description (separate with commas)..." class="w-full p-4 text-xs border outline-none h-24"></textarea>
                <button onclick="saveDress()" id="saveBtn" class="w-full amazon-btn py-4 text-[10px] font-bold uppercase tracking-[4px]">List Masterpiece</button>
            </div>
        </div>

        <div id="homeView">
            <div class="text-center mb-16">
                <h2 class="text-5xl md:text-7xl font-luxury italic mb-4">Vibrant Elegance</h2>
                <div class="w-12 h-[1px] bg-pink-200 mx-auto mb-4"></div>
                <p class="text-[9px] tracking-[0.4em] text-gray-400 uppercase">Spring Summer Collection 2026</p>
            </div>
            
            <div id="productGrid" class="product-grid">
                </div>
        </div>

        <div id="detailView" class="hidden">
            <div class="flex flex-col md:flex-row gap-16">
                <div class="w-full md:w-1/2">
                    <img id="mainDetailImg" src="" class="w-full aspect-[3/4] object-cover shadow-sm">
                </div>
                <div class="w-full md:w-1/2 flex flex-col justify-center">
                    <p id="detailCat" class="text-pink-600 font-bold text-[10px] tracking-widest uppercase mb-4"></p>
                    <h2 id="detailTitle" class="text-4xl font-luxury mb-6 leading-tight"></h2>
                    <p id="detailPrice" class="text-2xl font-light mb-10 text-gray-900"></p>
                    <div class="border-t border-gray-100 pt-8 mb-10">
                        <ul id="detailBullets" class="text-xs text-gray-500 space-y-4 italic"></ul>
                    </div>
                    <a id="detailLink" href="#" target="_blank" class="amazon-btn py-5 text-[11px] font-bold uppercase tracking-[4px]">Acquire Now</a>
                    <button onclick="goHome()" class="mt-8 text-[9px] text-gray-300 hover:text-black transition tracking-widest uppercase">← Back</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-40 py-20 border-t border-gray-50 text-center">
        <p class="text-[9px] text-gray-300 italic mb-4">*As an Amazon Associate, Modaura earns from qualifying purchases.</p>
        <p class="text-[9px] tracking-[0.6em] text-gray-200 uppercase">© 2026 MODAURA LUXURY</p>
    </footer>

    <script>
        // Double Checked: Ab ye Vercel APIs use karega
        let allProducts = [];

        async function fetchProducts() {
            try {
                const res = await fetch('/api/get-dresses');
                const data = await res.json();
                return data || [];
            } catch (e) {
                console.error("Fetch failed", e);
                return [];
            }
        }

        async function saveDress() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "PUBLISHING...";
            const data = {
                name: document.getElementById('dressName').value,
                price: document.getElementById('dressPrice').value,
                category: document.getElementById('dressCategory').value,
                image: document.getElementById('dressImage').value,
                link: document.getElementById('amazonLink').value,
                desc: document.getElementById('dressDesc').value,
                id: Date.now()
            };
            
            try {
                await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                window.location.reload();
            } catch (e) {
                alert("Error saving!");
                btn.innerText = "List Masterpiece";
            }
        }

        function toggleAdmin() { if (prompt("Access Key:") === "rafay1259") document.getElementById('adminPanel').classList.toggle('hidden'); }

        async function init() {
            allProducts = await fetchProducts();
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (productId) { showDetails(productId); } else { renderGrid(allProducts); }
        }

        function renderGrid(products) {
            const grid = document.getElementById('productGrid');
            if (!products || products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-300 italic text-[10px] tracking-widest uppercase">Collection Empty</div>`;
                return;
            }
            grid.innerHTML = products.map(item => `
                <div class="cursor-pointer group" onclick='updateUrlAndShow(${item.id})'>
                    <div class="img-wrapper mb-6 shadow-sm">
                        <img src="${item.image}" loading="lazy">
                    </div>
                    <div class="text-center md:text-left">
                        <p class="text-[9px] font-bold tracking-widest text-pink-600 mb-2 uppercase italic">${item.category}</p>
                        <h3 class="text-xs font-bold tracking-widest text-gray-900 mb-2 uppercase">${item.name}</h3>
                        <p class="font-luxury text-xl text-gray-800">$${item.price}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateUrlAndShow(id) {
            window.history.pushState({}, '', `?id=${id}`);
            showDetails(id);
        }

        function showDetails(id) {
            const p = allProducts.find(item => item.id == id);
            if(!p) return;
            document.getElementById('mainDetailImg').src = p.image;
            document.getElementById('detailTitle').innerText = p.name;
            document.getElementById('detailPrice').innerText = `$${p.price}`;
            document.getElementById('detailCat').innerText = p.category;
            document.getElementById('detailLink').href = p.link;
            document.getElementById('detailBullets').innerHTML = p.desc.split(',').map(b => `<li>— ${b.trim()}</li>`).join('');
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function goHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
            renderGrid(allProducts);
        }
        init();
    </script>
</body>
</html>
