<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modaura | New York Luxury</title>
    <meta name="p:domain_verify" content="8f77429b5d097004d2a19de3d10f52ba"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #FFF; color: #111; overflow-x: hidden; }
        .font-luxury { font-family: 'Bodoni Moda', serif; }
        
        /* Desktop Optimized Grid */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 60px; 
            padding: 40px 0;
        }

        .amazon-btn { background: #111; color: white; border-radius: 0px; transition: 0.4s; cursor: pointer; border: 1px solid #111; text-align: center; }
        .amazon-btn:hover { background: transparent; color: #111; }
        
        .nav-link { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; color: #999; transition: 0.3s; }
        .nav-link:hover { color: #AD1457; }
        
        .hidden { display: none; }
        
        /* Premium Image Container */
        .img-wrapper { aspect-ratio: 3/4; overflow: hidden; background: #f9f9f9; position: relative; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover img { transform: scale(1.05); }

        @media (max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
        }
    </style>
</head>
<body>

    <nav class="py-10 px-12 md:px-24 flex justify-between items-center bg-white sticky top-0 z-50 border-b border-gray-50">
        <div onclick="goHome()" class="cursor-pointer">
            <h1 class="text-3xl font-luxury italic tracking-tighter text-[#AD1457]">MODAURA</h1>
            <p class="text-[9px] tracking-[0.5em] text-gray-400 font-bold">NEW YORK • PARIS</p>
        </div>
        
        <div class="flex gap-12 items-center">
            <button onclick="toggleAdmin()" class="nav-link">Studio</button>
            <button onclick="goHome()" class="nav-link text-black border-b-2 border-black pb-1">Boutique</button>
        </div>
    </nav>

    <main class="max-w-[1400px] mx-auto px-8 md:px-24 py-20">
        
        <div id="adminPanel" class="hidden max-w-2xl mx-auto mb-32 p-16 bg-white border border-gray-100 shadow-2xl">
            <h3 class="font-luxury italic text-4xl mb-12 text-center">Inventory Studio</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="text" id="dressName" placeholder="Product Title" class="p-5 text-sm bg-gray-50 border-none outline-none focus:ring-1 ring-pink-100">
                <input type="number" id="dressPrice" placeholder="Price ($)" class="p-5 text-sm bg-gray-50 border-none outline-none focus:ring-1 ring-pink-100">
                <input type="text" id="dressCategory" placeholder="Category" class="p-5 text-sm bg-gray-50 border-none outline-none focus:ring-1 ring-pink-100">
                <input type="text" id="amazonLink" placeholder="Amazon Link" class="p-5 text-sm bg-gray-50 border-none outline-none focus:ring-1 ring-pink-100">
                <input type="text" id="dressImage1" placeholder="Image 1 URL" class="col-span-full p-5 text-sm bg-gray-50 border-none outline-none">
                <input type="text" id="dressImage2" placeholder="Image 2 URL" class="p-5 text-sm bg-gray-50 border-none outline-none">
                <input type="text" id="dressImage3" placeholder="Image 3 URL" class="p-5 text-sm bg-gray-50 border-none outline-none">
                <textarea id="dressDesc" placeholder="Description bullets..." class="col-span-full p-5 text-sm bg-gray-50 border-none outline-none h-32"></textarea>
                <button onclick="saveDress()" id="saveBtn" class="col-span-full amazon-btn py-6 font-bold uppercase tracking-[5px]">Publish Masterpiece</button>
            </div>
        </div>

        <div id="homeView">
            <div class="mb-32">
                <h2 class="text-7xl md:text-9xl font-luxury italic mb-10 leading-none">Vibrant<br>&nbsp;&nbsp;&nbsp;Elegance</h2>
                <div class="flex items-center gap-8">
                    <div class="h-[1px] w-32 bg-black"></div>
                    <p class="text-[11px] tracking-[0.8em] text-gray-500 uppercase">Spring Summer Collection 2026</p>
                </div>
            </div>
            
            <div id="productGrid" class="product-grid">
                <div class="col-span-full text-center py-20 text-gray-400 animate-pulse tracking-widest text-xs">RECOVERING DATABASE CONNECTION...</div>
            </div>
        </div>

        <div id="detailView" class="hidden">
            <div class="flex flex-col lg:flex-row gap-32">
                <div class="w-full lg:w-3/5 flex gap-8">
                    <div class="flex flex-col gap-5">
                        <img id="thumb1" onclick="swapImg(this.src)" class="w-24 aspect-[3/4] object-cover cursor-pointer hover:opacity-70 transition border border-gray-100">
                        <img id="thumb2" onclick="swapImg(this.src)" class="w-24 aspect-[3/4] object-cover cursor-pointer hover:opacity-70 transition border border-gray-100">
                        <img id="thumb3" onclick="swapImg(this.src)" class="w-24 aspect-[3/4] object-cover cursor-pointer hover:opacity-70 transition border border-gray-100">
                    </div>
                    <div class="flex-1 shadow-2xl overflow-hidden">
                        <img id="mainDetailImg" src="" class="w-full object-cover">
                    </div>
                </div>
                <div class="w-full lg:w-2/5 flex flex-col justify-center">
                    <p id="detailCat" class="text-pink-600 font-bold text-[11px] tracking-[0.4em] uppercase mb-8"></p>
                    <h2 id="detailTitle" class="text-6xl font-luxury mb-10 leading-tight"></h2>
                    <p id="detailPrice" class="text-4xl font-light mb-16"></p>
                    <div class="border-y border-gray-100 py-10 mb-16">
                        <ul id="detailBullets" class="text-sm text-gray-400 space-y-5 italic"></ul>
                    </div>
                    <a id="detailLink" href="#" target="_blank" class="amazon-btn py-7 text-[12px] font-bold uppercase tracking-[5px]">Acquire Now</a>
                    <button onclick="goHome()" class="mt-12 text-[10px] text-gray-300 hover:text-black transition tracking-widest uppercase">← Back to Collection</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-60 py-24 border-t border-gray-50 bg-[#FAFAFA] text-center">
        <div class="flex justify-center gap-20 mb-16">
            <a href="https://www.tiktok.com/@modaura.pk" target="_blank" class="nav-link">TikTok</a>
            <a href="https://www.pinterest.com/Modaura_Official/" target="_blank" class="nav-link">Pinterest</a>
        </div>
        <p class="text-[10px] text-gray-400 italic mb-4">*As an Amazon Associate, Modaura earns from qualifying purchases.</p>
        <p class="text-[10px] tracking-[1em] text-gray-300 uppercase">© 2026 MODAURA NEW YORK</p>
    </footer>

    <script>
        const UPSTASH_URL = "https://humorous-walrus-45015.upstash.io";
        const UPSTASH_TOKEN = "Aa_XAAIncDJkZDNmYTRkZjY3YTg0YWM4OTYzMWYzYWIxNTE4ZTJlYnAyNDUwMTU";
        
        // Comprehensive key check to find "modaura-db" or any Neon-related leftovers
        const SEARCH_KEYS = ["modaura_final_v3", "modaura_db", "modaura-db", "dresses", "modaura_final_v2"];

        let allProducts = [];

        async function fetchProducts() {
            let combined = [];
            for (let k of SEARCH_KEYS) {
                try {
                    const res = await fetch(`${UPSTASH_URL}/hgetall/${k}`, { headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` }});
                    const data = await res.json();
                    if (data.result) {
                        for (let i = 1; i < data.result.length; i += 2) {
                            combined.push(JSON.parse(data.result[i]));
                        }
                    }
                } catch (e) { console.warn("Searching key: " + k); }
            }
            return Array.from(new Map(combined.map(item => [item.id, item])).values());
        }

        async function saveDress() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "UPLOADING TO MODAURA-DB...";
            const data = {
                name: document.getElementById('dressName').value,
                price: document.getElementById('dressPrice').value,
                category: document.getElementById('dressCategory').value,
                images: [document.getElementById('dressImage1').value, document.getElementById('dressImage2').value, document.getElementById('dressImage3').value],
                link: document.getElementById('amazonLink').value,
                desc: document.getElementById('dressDesc').value,
                id: Date.now()
            };
            // Saving to BOTH keys to ensure it never gets lost again
            for (let k of ["modaura_final_v3", "modaura_db"]) {
                await fetch(`${UPSTASH_URL}/hset/${k}`, {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` },
                    body: JSON.stringify([data.id, JSON.stringify(data)])
                });
            }
            window.location.reload();
        }

        function toggleAdmin() { if (prompt("Access Key:") === "rafay1259") document.getElementById('adminPanel').classList.toggle('hidden'); }
        function swapImg(src) { if(src) document.getElementById('mainDetailImg').src = src; }

        async function init() {
            allProducts = await fetchProducts();
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (productId) { showDetails(productId); } else { renderGrid(allProducts); }
        }

        function renderGrid(products) {
            const grid = document.getElementById('productGrid');
            if (products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-40 border-2 border-dashed border-gray-100">
                    <p class="text-[11px] tracking-[0.3em] text-gray-300 uppercase italic mb-6">Database connection recovered but no pieces found.</p>
                    <button onclick="toggleAdmin()" class="text-[10px] font-bold underline">ADD FIRST PIECE TO BOUTIQUE</button>
                </div>`;
                return;
            }
            grid.innerHTML = products.map(item => `
                <div class="cursor-pointer product-card group" onclick='updateUrlAndShow(${item.id})'>
                    <div class="img-wrapper mb-10 shadow-sm">
                        <img src="${item.images[0]}" loading="lazy">
                    </div>
                    <div class="text-center md:text-left">
                        <p class="text-[10px] font-bold tracking-[0.5em] text-pink-600 mb-4 uppercase italic">${item.category}</p>
                        <h3 class="text-sm font-bold tracking-widest text-gray-900 mb-3 uppercase">${item.name}</h3>
                        <p class="font-luxury text-3xl text-gray-800">$${item.price}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateUrlAndShow(id) {
            window.history.pushState({}, '', `?id=${id}`);
            showDetails(id);
        }

        function showDetails(id) {
            const p = allProducts.find(item => item.id == id);
            if(!p) return;
            document.getElementById('mainDetailImg').src = p.images[0];
            document.getElementById('thumb1').src = p.images[0];
            document.getElementById('thumb2').src = p.images[1] || p.images[0];
            document.getElementById('thumb3').src = p.images[2] || p.images[0];
            document.getElementById('detailTitle').innerText = p.name;
            document.getElementById('detailPrice').innerText = `$${p.price}`;
            document.getElementById('detailCat').innerText = p.category;
            document.getElementById('detailLink').href = p.link;
            document.getElementById('detailBullets').innerHTML = p.desc.split(',').map(b => `<li>— ${b.trim()}</li>`).join('');
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function goHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
            renderGrid(allProducts);
        }
        init();
    </script>
</body>
    </html>
