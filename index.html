<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modaura | New York Luxury Affiliate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #FFF5F7; color: #2D2D2D; }
        .font-luxury { font-family: 'Bodoni Moda', serif; }
        .product-card { background: white; border-radius: 15px; transition: all 0.4s ease; border: 1px solid rgba(255,192,203,0.3); }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(233,30,99,0.1); }
        .nav { background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); }
        .btn-primary { background: #AD1457; color: white; transition: 0.3s; cursor: pointer; border: none; }
        .btn-primary:hover { background: #880E4F; transform: translateY(-2px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .size-btn:focus { border-color: #AD1457; color: #AD1457; background: #FCE4EC; outline: none; }
        .hidden { display: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <nav class="nav sticky top-0 z-50 p-6 flex justify-between items-center border-b border-pink-100">
        <h1 onclick="goHome()" class="text-2xl font-luxury italic tracking-widest text-[#AD1457] cursor-pointer">MODAURA</h1>
        <div class="flex gap-6 items-center">
            <button onclick="toggleAdmin()" class="text-pink-400 text-[10px] md:text-sm font-bold uppercase tracking-widest">Studio</button>
            <button onclick="goHome()" class="border-b-2 border-pink-500 text-pink-700 text-[10px] md:text-sm font-bold uppercase">Archive</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div id="homeView">
            <header class="text-center mb-20">
                <span class="text-[9px] tracking-[0.8em] text-pink-400 uppercase mb-4 block font-bold italic">EST. 2026 • NEW YORK</span>
                <h2 class="text-5xl md:text-7xl font-luxury italic mb-4 text-gray-800">Vibrant Elegance</h2>
                <p class="text-[10px] md:text-xs text-gray-400 uppercase tracking-[0.4em] font-light italic">Defining the Modern Silhouette</p>
            </header>
            <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 mb-24"></div>
        </div>

        <div id="adminView" class="hidden max-w-2xl mx-auto bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-pink-100">
            <h2 class="text-center font-luxury italic text-3xl mb-12 text-[#AD1457]">Inventory Manager</h2>
            <form id="productForm" class="space-y-6">
                <input type="text" id="name" placeholder="Dress Name" class="w-full p-4 border-b border-gray-200 outline-none" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" step="0.01" id="price" placeholder="Price ($)" class="w-full p-4 border-b border-gray-200 outline-none" required>
                    <input type="text" id="category" placeholder="Category" class="w-full p-4 border-b border-gray-200 outline-none">
                </div>
                <input type="url" id="img1" placeholder="Main Image URL" class="w-full p-4 border-b border-gray-200 outline-none" required>
                <input type="url" id="img2" placeholder="Second Image URL" class="w-full p-4 border-b border-gray-200 outline-none">
                <input type="url" id="img3" placeholder="Third Image URL" class="w-full p-4 border-b border-gray-200 outline-none">
                <input type="url" id="link" placeholder="Amazon Affiliate Link" class="w-full p-4 border-b border-gray-200 outline-none" required>
                <textarea id="desc" placeholder="Dress Description" class="w-full p-4 border-b border-gray-200 outline-none h-32"></textarea>
                <button type="submit" id="submitBtn" class="w-full py-5 btn-primary rounded-full font-bold uppercase tracking-widest">Upload to Boutique</button>
            </form>
        </div>

        <div id="detailsView" class="hidden"></div>
    </main>

    <script>
        const UPSTASH_URL = "https://humorous-walrus-45015.upstash.io";
        const UPSTASH_TOKEN = "Aa_XAAIncDJkZDNmYTRkZjY3YTg0YWM4OTYzMWYzYWIxNTE4ZTJlYnAyNDUwMTU";

        async function getProducts() {
            try {
                const response = await fetch(`${UPSTASH_URL}/hgetall/products`, {
                    headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` }
                });
                const data = await response.json();
                if (!data.result || Object.keys(data.result).length === 0) return [];
                return Object.values(data.result).map(p => {
                    try { return JSON.parse(p); } catch(e) { return null; }
                }).filter(p => p !== null);
            } catch (e) { return []; }
        }

        async function saveProduct(product) {
            const id = Date.now().toString();
            product.id = id;
            document.getElementById('submitBtn').disabled = true;
            await fetch(`${UPSTASH_URL}/hset/products`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` },
                body: JSON.stringify([id, JSON.stringify(product)])
            });
            window.location.reload();
        }

        function toggleAdmin() {
            if (prompt("Studio Password:") === "rafay1259") {
                document.getElementById('homeView').classList.add('hidden');
                document.getElementById('detailsView').classList.add('hidden');
                document.getElementById('adminView').classList.remove('hidden');
            }
        }

        function goHome() { window.location.reload(); }

        async function init() {
            const products = await getProducts();
            const grid = document.getElementById('productGrid');
            if (products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 italic">No trends curated yet.</p>`;
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="product-card p-4 cursor-pointer" onclick='showProductDetails(${JSON.stringify(p)})'>
                    <img src="${p.image}" class="w-full h-[450px] object-cover rounded-2xl mb-6 shadow-sm">
                    <div class="text-center px-4 pb-4">
                        <span class="text-[8px] uppercase tracking-widest text-pink-300 mb-2 block font-bold italic">${p.category || 'Luxury'}</span>
                        <h3 class="font-luxury italic text-xl mb-2 text-gray-700">${p.name}</h3>
                        <p class="text-pink-500 font-bold">$${p.price}</p>
                    </div>
                </div>
            `).join('');
        }

        function showProductDetails(product) {
            document.getElementById('homeView').classList.add('hidden');
            const dv = document.getElementById('detailsView');
            dv.classList.remove('hidden');
            dv.innerHTML = `
                <button onclick="goHome()" class="mb-12 text-pink-400 font-bold uppercase text-xs tracking-widest">← Back</button>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                    <div>
                        <img src="${product.image}" id="mainDisplayImg" class="w-full rounded-3xl shadow-2xl mb-6 aspect-[3/4] object-cover">
                        <div class="flex gap-4 overflow-x-auto pb-4 scrollbar-hide">
                            <img src="${product.image}" onclick="document.getElementById('mainDisplayImg').src=this.src" class="w-24 h-32 object-cover rounded-xl cursor-pointer border-2 border-pink-300">
                            ${product.image2 ? `<img src="${product.image2}" onclick="document.getElementById('mainDisplayImg').src=this.src" class="w-24 h-32 object-cover rounded-xl cursor-pointer border hover:border-pink-400">` : ''}
                            ${product.image3 ? `<img src="${product.image3}" onclick="document.getElementById('mainDisplayImg').src=this.src" class="w-24 h-32 object-cover rounded-xl cursor-pointer border hover:border-pink-400">` : ''}
                        </div>
                    </div>
                    <div class="flex flex-col justify-center">
                        <span class="text-xs uppercase tracking-[0.3em] text-pink-300 mb-4 font-bold italic">${product.category || 'Luxury Selection'}</span>
                        <h1 class="text-4xl md:text-6xl font-luxury italic mb-6 text-gray-800">${product.name}</h1>
                        <p class="text-3xl mb-8 text-pink-600 font-bold">$${product.price}</p>
                        <div class="mb-10">
                            <h3 class="text-xs font-bold uppercase mb-4 tracking-widest text-gray-400 italic">Select Size (US)</h3>
                            <div class="flex gap-4">${['S', 'M', 'L', 'XL'].map(s => `<button class="size-btn w-12 h-12 border border-gray-200 rounded-full font-bold text-[10px] hover:border-pink-500">${s}</button>`).join('')}</div>
                        </div>
                        <p class="text-gray-500 mb-10 italic font-light">"${product.description || ''}"</p>
                        <a href="${product.link}" target="_blank" class="btn-primary text-center py-5 rounded-full font-bold uppercase tracking-widest">Buy on Amazon</a>
                    </div>
                </div>`;
            window.scrollTo(0,0);
        }

        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            await saveProduct({
                name: document.getElementById('name').value,
                price: document.getElementById('price').value,
                image: document.getElementById('img1').value,
                image2: document.getElementById('img2').value,
                image3: document.getElementById('img3').value,
                link: document.getElementById('link').value,
                category: document.getElementById('category').value,
                description: document.getElementById('desc').value
            });
        };
        init();
    </script>
</body>
    </html>
