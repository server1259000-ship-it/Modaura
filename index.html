html{scroll-behavior:smooth}body{font-family:Inter,sans-serif;background:#fff;color:#000;-webkit-font-smoothing:antialiased;overflow-x:hidden}.font-luxury{font-family:'Bodoni Moda',serif}.logo-main{font-family:'Bodoni Moda',serif;font-style:italic;color:#964B6B;font-weight:700;letter-spacing:-2px}.new-arrival-tag{position:absolute;top:15px;left:15px;background:#fff;color:#000;padding:6px 12px;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;z-index:40;border:1px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,0.1);pointer-events:none}.fade-in{animation:reveal 1.2s cubic-bezier(0.16,1,0.3,1)}@keyframes reveal{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:80px 50px;padding:60px;max-width:1600px;margin:0 auto}.img-container{aspect-ratio:3/4;overflow:hidden;background:#fcfcfc;position:relative;border:1px solid #f5f5f5;display:flex;align-items:center;justify-content:center}.product-card{transition:transform .6s cubic-bezier(0.16,1,0.3,1)}.product-card:hover{transform:translateY(-8px)}.img-container img{width:100%;height:100%;object-fit:cover!important;transition:transform 1.5s cubic-bezier(0.16,1,0.3,1)}.product-card:hover img{transform:scale(1.05)}.price-tag{font-family:'Bodoni Moda',serif;font-style:italic;color:#C5A059;font-weight:500}.btn-nyc{background:#000;color:#fff;padding:24px;font-size:11px;font-weight:600;letter-spacing:5px;text-transform:uppercase;width:100%;display:block;text-align:center;border:1px solid #000;margin-top:30px;transition:all .5s cubic-bezier(0.16,1,0.3,1)}.btn-nyc:hover{background:0 0;color:#000;letter-spacing:7px;transform:scale(1.01)}#adminPanel{background:#fff!important;z-index:10000;position:fixed;inset:0;overflow-y:auto;padding:40px}.hidden{display:none!important}@media (max-width:768px){.product-grid{grid-template-columns:repeat(2,1fr)!important;gap:25px 15px!important;padding:15px!important}.logo-main{font-size:1.4rem!important}#detailView{padding:1.5rem!important}.new-arrival-tag{top:8px;left:8px;font-size:6px;padding:4px 8px}}
</style></head><body><nav class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-gray-100 z-[500] px-12 py-8 flex justify-between items-center"><div onclick="goHome()" class="cursor-pointer text-center md:text-left"><h1 class="text-4xl logo-main">Modaura</h1><p class="text-[7px] tracking-[.6em] text-gray-400 font-bold uppercase mt-1">Where Fashion Meets Elegance</p></div><div class="flex gap-14 items-center"><button onclick="toggleAdmin()" class="text-[10px] tracking-[.4em] text-gray-300 uppercase hover:text-black transition-colors">Studio</button><button onclick="goHome()" class="text-[12px] tracking-[.3em] font-bold uppercase border-b-2 border-black pb-1">Collection</button></div></nav><main><div id="homeView" class="fade-in"><header class="text-center py-40 px-6"><div class="text-[11px] tracking-[1em] text-[#964B6B] font-extrabold uppercase mb-8 opacity-80">Spring Summer 2026</div><h2 class="text-8xl font-luxury italic mb-12 tracking-tighter leading-none">Vibrant Elegance</h2><p class="text-[12px] tracking-[.6em] text-gray-400 uppercase italic">Curating the Manhattan Aesthetic.</p></header><div id="productGrid" class="product-grid"></div></div><div id="detailView" class="hidden p-8 md:p-24 max-w-[1700px] mx-auto fade-in"><div class="flex flex-col lg:flex-row gap-12 md:gap-32 mb-20 md:mb-40"><div class="w-full lg:w-3/5 flex flex-col-reverse md:flex-row gap-6 md:gap-10"><div id="thumbContainer" class="flex flex-col gap-6"></div><div class="flex-1 img-container shadow-sm"><img id="mainDetailImg" src="" class="w-full h-full object-cover transition-opacity duration-500"></div></div><div class="w-full lg:w-2/5 flex flex-col justify-center"><p id="detailCat" class="text-[#964B6B] text-[11px] font-bold tracking-[0.7em] uppercase mb-4 md:mb-8"></p><h2 id="detailTitle" class="text-4xl md:text-7xl font-luxury italic mb-6 md:mb-10 leading-tight"></h2><p id="detailPrice" class="price-tag mb-8 md:mb-14 text-4xl md:text-7xl"></p><div class="border-t border-b border-gray-100 py-10 md:py-16 mb-8 md:mb-12"><ul id="detailBullets" class="text-[14px] md:text-[16px] text-gray-500 space-y-4 md:space-y-6 font-light italic leading-relaxed"></ul></div><a id="detailLink" href="#" target="_blank" rel="sponsored noopener" class="btn-nyc">Acquire on Amazon</a><button onclick="goHome()" class="mt-12 md:mt-16 text-[10px] text-gray-400 uppercase tracking-[0.5em] hover:text-black">← Back to Collection</button></div></div><div id="suggestionSection" class="border-t border-gray-100 pt-20 md:pt-32 hidden"><h4 class="font-luxury text-3xl md:text-5xl italic mb-12 md:mb-20 text-center">Complete the Look</h4><div id="suggestionGrid" class="grid grid-cols-2 md:grid-cols-4 gap-8 md:gap-16"></div></div></div><div id="adminPanel" class="hidden"><div class="max-w-3xl mx-auto bg-white p-10 md:p-20 border shadow-2xl mt-10"><h3 class="font-luxury text-3xl italic text-[#964B6B] border-b pb-6 mb-8">Studio Inventory</h3><div id="inventoryList" class="mb-10 space-y-4 max-h-72 overflow-y-auto pr-4"></div><div class="grid gap-6"><input type="text" id="dressName" placeholder="Piece Title" class="border-b p-3 outline-none uppercase tracking-widest text-xs"><input type="number" id="dressPrice" placeholder="Price (USD)" class="border-b p-3 outline-none"><input type="text" id="dressCategory" placeholder="Category" class="border-b p-3 outline-none uppercase text-xs"><input type="text" id="amazonLink" placeholder="Amazon Link" class="border-b p-3 outline-none text-xs"><input type="text" id="img1" placeholder="Img 1" class="border-b p-3 outline-none text-xs"><input type="text" id="img2" placeholder="Img 2" class="border-b p-3 outline-none text-xs"><input type="text" id="img3" placeholder="Img 3" class="border-b p-3 outline-none text-xs"><textarea id="dressDesc" placeholder="Features (comma separated)" class="border p-4 h-32 outline-none italic text-xs"></textarea><button id="saveBtn" onclick="saveDress()" class="btn-nyc">Publish to Collection</button><button onclick="closeStudio()" class="text-center text-xs text-gray-400 mt-4 w-full">Cancel</button></div></div></div></main><footer class="bg-black text-white py-20 px-10 mt-40"><div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-16"><div><h4 class="font-luxury text-3xl italic mb-6">Modaura</h4><p class="text-[10px] tracking-[0.4em] uppercase text-gray-500">The epitome of Manhattan luxury fashion.</p></div><div class="flex flex-col gap-6"><p class="text-[11px] tracking-[0.6em] text-white uppercase font-bold mb-2">Connect</p><button onclick="window.open('https://www.tiktok.com/@modaura.pk','_blank')" class="text-left text-[11px] text-gray-400 uppercase tracking-[0.3em] hover:text-white transition-all">TikTok</button><button onclick="window.open('https://pinterest.com/Modaura_Official/','_blank')" class="text-left text-[11px] text-gray-400 uppercase tracking-[0.3em] hover:text-white transition-all">Pinterest</button></div><div><p class="text-[11px] tracking-[0.6em] text-white uppercase font-bold mb-6">House Newsletter</p><div class="flex border-b border-gray-700 pb-4"><input type="email" placeholder="ENTER EMAIL" class="bg-transparent w-full text-[10px] outline-none tracking-widest text-white transition-all focus:border-white"></div></div></div><p class="text-center text-[8px] tracking-[0.8em] text-gray-700 mt-20 uppercase">© 2026 Modaura House</p></footer><script>
let allProducts=[];
let editingId = null; // New variable for edit mode

async function fetchProducts(){try{const r=await fetch('/api/get-dresses?t='+Date.now());const d=await r.json();return Array.isArray(d)?d:d.result}catch(e){return[]}}

async function saveDress(){
    const d={
        name:document.getElementById('dressName').value,
        price:document.getElementById('dressPrice').value,
        category:document.getElementById('dressCategory').value,
        images:[document.getElementById('img1').value,document.getElementById('img2').value,document.getElementById('img3').value].filter(u=>u&&u.trim()!==""),
        link:document.getElementById('amazonLink').value,
        desc:document.getElementById('dressDesc').value,
        id: editingId ? editingId : Date.now() 
    };
    
    const endpoint = editingId ? '/api/update' : '/api/save';
    
    await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    editingId = null;
    window.location.reload();
}

async function deleteDress(id){if(confirm("Remove this piece?")){await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});window.location.reload()}}

// NEW EDIT FUNCTION
function editDress(id) {
    const p = allProducts.find(x => x.id == id);
    if(p) {
        editingId = id;
        document.getElementById('dressName').value = p.name;
        document.getElementById('dressPrice').value = p.price;
        document.getElementById('dressCategory').value = p.category;
        document.getElementById('amazonLink').value = p.link;
        document.getElementById('img1').value = p.images[0] || "";
        document.getElementById('img2').value = p.images[1] || "";
        document.getElementById('img3').value = p.images[2] || "";
        document.getElementById('dressDesc').value = p.desc;
        
        document.getElementById('saveBtn').innerText = "Update Piece Details";
        document.querySelector('#adminPanel h3').innerText = "Edit Mode: " + p.name;
        document.getElementById('dressName').focus();
    }
}

function renderGrid(p){document.getElementById('productGrid').innerHTML=p.map(i=>`<div class="product-card cursor-pointer relative fade-in" onclick='updateUrlAndShow(${i.id})'><div class="new-arrival-tag">New Arrival</div><div class="img-container mb-6"><img src="${i.images[0]}" style="width:100%;height:100%;object-fit:cover" loading="lazy"></div><div class="text-center px-2"><p class="text-[9px] tracking-[0.4em] text-[#964B6B] font-bold uppercase mb-2">${i.category}</p><h3 class="text-[12px] font-semibold tracking-widest text-gray-900 mb-2 uppercase leading-relaxed">${i.name}</h3><p class="price-tag text-xl">$${i.price}</p></div></div>`).join('')}
function updateUrlAndShow(id){const u=window.location.protocol+"//"+window.location.host+window.location.pathname+'?id='+id;window.history.pushState({path:u},'',u);showDetails(id)}
function showDetails(id){const p=allProducts.find(x=>x.id==id);if(!p)return;window.scrollTo({top:0,behavior:'smooth'});document.getElementById('mainDetailImg').src=p.images[0];document.getElementById('detailTitle').innerText=p.name;document.getElementById('detailPrice').innerText=`$${p.price}`;document.getElementById('detailCat').innerText=p.category;document.getElementById('detailLink').href=p.link;document.getElementById('detailBullets').innerHTML=(p.desc||"").split(',').map(b=>`<li>— ${b.trim()}</li>`).join('');document.getElementById('thumbContainer').innerHTML=p.images.map(img=>`<img src="${img}" onclick="document.getElementById('mainDetailImg').style.opacity=0;setTimeout(()=>{document.getElementById('mainDetailImg').src=this.src;document.getElementById('mainDetailImg').style.opacity=1},200)" class="w-16 border border-gray-100 cursor-pointer hover:border-black aspect-[3/4] object-cover transition-all">`).join('');const s=allProducts.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4);if(s.length>0){document.getElementById('suggestionSection').classList.remove('hidden');document.getElementById('suggestionGrid').innerHTML=s.map(x=>`<div class="cursor-pointer text-center" onclick='updateUrlAndShow(${x.id})'><div class="aspect-[3/4] overflow-hidden mb-4"><img src="${x.images[0]}" class="w-full h-full object-cover"></div><p class="text-[9px] font-bold uppercase">${x.name}</p></div>`).join('')}document.getElementById('homeView').classList.add('hidden');document.getElementById('detailView').classList.remove('hidden')}
function goHome(){const u=window.location.protocol+"//"+window.location.host+window.location.pathname;window.history.pushState({path:u},'',u);document.getElementById('homeView').classList.remove('hidden');document.getElementById('detailView').classList.add('hidden');renderGrid(allProducts)}

// UPDATED toggleAdmin with EDIT button
function toggleAdmin(){
    if(prompt("Security Key:")==="rafay1259"){
        document.getElementById('adminPanel').classList.remove('hidden');
        document.getElementById('inventoryList').innerHTML=allProducts.map(x=>`
            <div class="flex justify-between items-center border-b py-4">
                <span class="text-xs uppercase font-bold">${x.name}</span>
                <div class="flex gap-4">
                    <button onclick="editDress(${x.id})" class="text-blue-500 text-xs font-bold uppercase">Edit</button>
                    <button onclick="deleteDress(${x.id})" class="text-red-500 text-xs uppercase">Remove</button>
                </div>
            </div>`).join('')
    }
}

function closeStudio(){
    editingId = null;
    document.getElementById('saveBtn').innerText = "Publish to Collection";
    document.querySelector('#adminPanel h3').innerText = "Studio Inventory";
    document.getElementById('adminPanel').classList.add('hidden');
}
async function init(){allProducts=await fetchProducts();const i=new URLSearchParams(window.location.search).get('id');if(i)showDetails(i);else renderGrid(allProducts)}init();
</script></body></html>
