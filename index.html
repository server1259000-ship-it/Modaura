<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODAURA | NY Editorial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,700&family=Inter:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }
        .font-luxury { font-family: 'Bodoni Moda', serif; }
        
        /* Editorial Grid */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 2px; /* Ultra thin luxury gap */
            background: #111;
        }

        @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .product-grid { grid-template-columns: 1fr; } }

        /* NY Gallery Hover */
        .product-card { position: relative; overflow: hidden; background: #000; transition: 0.5s; }
        .img-container { aspect-ratio: 2/3; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 1.2s cubic-bezier(0.2, 1, 0.3, 1); filter: grayscale(20%); }
        .product-card:hover img { transform: scale(1.08); filter: grayscale(0%); }

        /* Premium Buttons */
        .ny-btn { border: 1px solid #fff; padding: 15px 30px; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; transition: 0.4s; cursor: pointer; display: inline-block; }
        .ny-btn:hover { background: #fff; color: #000; }

        .hidden { display: none; }
        .fade-in { animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <nav class="p-10 flex justify-between items-center sticky top-0 z-50 bg-black/80 backdrop-blur-md">
        <div onclick="goHome()" class="cursor-pointer group">
            <h1 class="text-3xl font-luxury tracking-tighter">MODA<span class="italic text-gray-500 group-hover:text-white transition">URA</span></h1>
            <p class="text-[7px] tracking-[0.5em] text-gray-500 uppercase">New York • Paris</p>
        </div>
        <div class="flex gap-10">
            <button onclick="toggleAdmin()" class="text-[10px] tracking-[0.3em] uppercase text-gray-400 hover:text-white transition">Studio</button>
            <button onclick="goHome()" class="text-[10px] tracking-[0.3em] uppercase border-b border-white pb-1">Collection</button>
        </div>
    </nav>

    <main class="fade-in">
        <div id="homeView">
            <div class="px-10 py-24 text-center border-b border-white/10">
                <h2 class="text-7xl md:text-[120px] font-luxury italic leading-none mb-6">Vibrant Elegance</h2>
                <p class="text-[10px] tracking-[0.8em] text-gray-400 uppercase">Spring Summer Collection 2026</p>
            </div>

            <div id="productGrid" class="product-grid">
                <div class="col-span-full py-40 text-center">
                    <p class="text-[10px] tracking-widest text-gray-600 italic uppercase">Curation in progress...</p>
                </div>
            </div>
        </div>

        <div id="detailView" class="hidden px-10 py-20">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-20">
                <div class="space-y-4">
                    <img id="mainDetailImg" src="" class="w-full object-cover shadow-2xl">
                    <div id="thumbContainer" class="flex gap-4"></div>
                </div>
                <div class="flex flex-col justify-center max-w-md">
                    <span id="detailCat" class="text-[#AD1457] text-[10px] tracking-[0.4em] font-bold uppercase mb-4"></span>
                    <h2 id="detailTitle" class="text-6xl font-luxury italic mb-6"></h2>
                    <p id="detailPrice" class="text-2xl font-light mb-10 text-gray-300"></p>
                    <div class="h-[1px] bg-white/10 w-full mb-10"></div>
                    <ul id="detailBullets" class="text-xs text-gray-400 space-y-4 italic mb-12"></ul>
                    <a id="detailLink" href="#" target="_blank" class="ny-btn text-center">Acquire Piece</a>
                    <button onclick="goHome()" class="mt-10 text-[9px] tracking-widest text-gray-500 hover:text-white uppercase">← Back to Gallery</button>
                </div>
            </div>
        </div>

        <div id="adminPanel" class="hidden fixed inset-0 bg-black/95 z-[100] p-10 overflow-y-auto">
            <div class="max-w-2xl mx-auto border border-white/10 p-10 bg-black">
                <div class="flex justify-between mb-10">
                    <h3 class="font-luxury text-3xl italic">Studio Inventory</h3>
                    <button onclick="document.getElementById('adminPanel').classList.add('hidden')" class="text-2xl">×</button>
                </div>
                <div class="grid gap-6">
                    <input type="text" id="dressName" placeholder="Product Name" class="bg-transparent border-b border-white/20 p-4 outline-none focus:border-white text-sm">
                    <input type="number" id="dressPrice" placeholder="Price ($)" class="bg-transparent border-b border-white/20 p-4 outline-none focus:border-white text-sm">
                    <input type="text" id="dressCategory" placeholder="Category (e.g. Evening)" class="bg-transparent border-b border-white/20 p-4 outline-none focus:border-white text-sm">
                    <input type="text" id="img1" placeholder="Main Image URL" class="bg-transparent border-b border-white/20 p-4 outline-none focus:border-white text-sm">
                    <input type="text" id="img2" placeholder="Second Image URL" class="bg-transparent border-b border-white/20 p-4 outline-none focus:border-white text-sm">
                    <input type="text" id="amazonLink" placeholder="Amazon Affiliate Link" class="bg-transparent border-b border-white/20 p-4 outline-none focus:border-white text-sm">
                    <textarea id="dressDesc" placeholder="Bullets (Separated by commas)" class="bg-transparent border-b border-white/20 p-4 outline-none focus:border-white text-sm h-32"></textarea>
                    <button onclick="saveDress()" id="saveBtn" class="ny-btn bg-white text-black font-bold">Publish to Boutique</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-20 border-t border-white/5 text-center mt-20">
        <div class="flex justify-center gap-12 mb-10 opacity-30 hover:opacity-100 transition">
            <a href="#" class="text-[10px] tracking-[0.4em] uppercase">Pinterest</a>
            <a href="#" class="text-[10px] tracking-[0.4em] uppercase">TikTok</a>
        </div>
        <p class="text-[8px] text-gray-700 italic tracking-widest lowercase">Curation by Modaura New York © 2026</p>
    </footer>

    <script>
        let allProducts = [];

        async function fetchProducts() {
            try {
                const res = await fetch('/api/get-dresses');
                const data = await res.json();
                return data || [];
            } catch (e) { return []; }
        }

        async function saveDress() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "UPLOADING...";
            const data = {
                name: document.getElementById('dressName').value,
                price: document.getElementById('dressPrice').value,
                category: document.getElementById('dressCategory').value,
                images: [document.getElementById('img1').value, document.getElementById('img2').value].filter(u => u),
                link: document.getElementById('amazonLink').value,
                desc: document.getElementById('dressDesc').value,
                id: Date.now()
            };
            await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            window.location.reload();
        }

        function toggleAdmin() { if (prompt("Access Key:") === "rafay1259") document.getElementById('adminPanel').classList.toggle('hidden'); }
        function swapImg(src) { document.getElementById('mainDetailImg').src = src; }

        async function init() {
            allProducts = await fetchProducts();
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (productId) showDetails(productId); else renderGrid(allProducts);
        }

        function renderGrid(products) {
            const grid = document.getElementById('productGrid');
            if (!products || products.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-40 text-center opacity-30 uppercase text-[10px] tracking-[0.5em]">The collection is currently being curated in New York...</div>`;
                return;
            }
            grid.innerHTML = products.map(item => `
                <div class="product-card group cursor-pointer" onclick='updateUrlAndShow(${item.id})'>
                    <div class="img-container">
                        <img src="${item.images[0]}" loading="lazy">
                    </div>
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-8">
                        <p class="text-[9px] tracking-[0.3em] uppercase text-white/70 mb-1">${item.category}</p>
                        <h3 class="text-xl font-luxury italic text-white">${item.name}</h3>
                        <p class="text-sm font-light mt-2">$${item.price}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateUrlAndShow(id) {
            window.history.pushState({}, '', `?id=${id}`);
            showDetails(id);
        }

        function showDetails(id) {
            const p = allProducts.find(item => item.id == id);
            if(!p) return;
            document.getElementById('mainDetailImg').src = p.images[0];
            document.getElementById('detailTitle').innerText = p.name;
            document.getElementById('detailPrice').innerText = `$${p.price}`;
            document.getElementById('detailCat').innerText = p.category;
            document.getElementById('detailLink').href = p.link;
            document.getElementById('detailBullets').innerHTML = p.desc.split(',').map(b => `<li>— ${b.trim()}</li>`).join('');
            
            const thumbDiv = document.getElementById('thumbContainer');
            thumbDiv.innerHTML = p.images.map(img => `<img src="${img}" onclick="swapImg(this.src)" class="w-20 aspect-[2/3] object-cover cursor-pointer border border-white/10 hover:border-white">`).join('');
            
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('fade-in'); 
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function goHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
            renderGrid(allProducts);
        }
        init();
    </script>
</body>
    </html>
