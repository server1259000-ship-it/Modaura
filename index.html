<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta name="google-site-verification" content="K1f0fufYHt5NdlMKVI2uuEdoLKLUJ9iX2OS0ATBq7Fs"/><title>Modaura | Luxury Manhattan Fashion</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#fff;color:#000;-webkit-font-smoothing:antialiased;overflow-x:hidden}.font-luxury{font-family:'Bodoni Moda',serif}.logo-main{font-family:'Bodoni Moda',serif;font-style:italic;color:#AD1457;font-weight:700;letter-spacing:-2px}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;padding:40px;max-width:1400px;margin:0 auto}@media(max-width:1024px){.product-grid{grid-template-columns:repeat(2,1fr);gap:20px;padding:20px}}@media(max-width:640px){.product-grid{grid-template-columns:1fr}h2.text-8xl{font-size:3.5rem!important}.logo-main{font-size:1.5rem!important}}.img-container{aspect-ratio:3/4;overflow:hidden;background:#fcfcfc;position:relative;border:1px solid #f5f5f5}.img-container img{width:100%;height:100%;object-fit:cover!important;transition:transform 1.5s ease}.product-card:hover img{transform:scale(1.03)}.price-tag{font-family:'Bodoni Moda',serif;font-style:italic;color:#C5A059;font-weight:500}.btn-nyc{background:#000;color:#fff;padding:20px;font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;width:100%;display:block;text-align:center;transition:all .3s ease}.btn-nyc:hover{background:#333;letter-spacing:5px}#adminPanel{z-index:10000;position:fixed;inset:0;background:#fff;overflow-y:auto;padding:20px}.hidden{display:none!important}.fade-in{animation:fadeIn .5s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@media(min-width:1200px){.img-container{max-height:80vh}}</style></head><body><nav class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-gray-100 z-[500] px-6 py-6 flex justify-between items-center"><div onclick="goHome()" class="cursor-pointer"><h1 class="text-3xl logo-main">Modaura</h1><p class="text-[7px] tracking-[.8em] text-gray-400 font-bold uppercase mt-1">New York • Paris • London</p></div><div class="flex gap-6 items-center"><button onclick="toggleAdmin()" class="text-[9px] tracking-[.3em] text-gray-300 uppercase">Studio</button><button onclick="goHome()" class="text-[10px] tracking-[.2em] font-bold uppercase border-b border-black">Collection</button></div></nav><main><div id="homeView" class="fade-in"><header class="text-center py-24 px-6"><div class="text-[9px] tracking-[.8em] text-[#AD1457] font-extrabold uppercase mb-4">Spring Summer 2026</div><h2 class="text-6xl md:text-8xl font-luxury italic mb-6 tracking-tighter">Vibrant Elegance</h2><p class="text-[10px] tracking-[.4em] text-gray-400 uppercase italic">Curating the Manhattan Aesthetic.</p></header><div id="productGrid" class="product-grid"></div></div><div id="detailView" class="hidden p-6 md:p-20 max-w-[1400px] mx-auto fade-in"><div class="flex flex-col lg:flex-row gap-12"><div class="w-full lg:w-1/2 flex gap-4"><div id="thumbContainer" class="flex flex-col gap-4"></div><div class="flex-1 img-container"><img id="mainDetailImg" src=""></div></div><div class="w-full lg:w-1/2 flex flex-col justify-center"><p id="detailCat" class="text-[#AD1457] text-[10px] font-bold tracking-[0.5em] uppercase mb-4"></p><h2 id="detailTitle" class="text-5xl font-luxury italic mb-6"></h2><p id="detailPrice" class="price-tag text-5xl mb-8"></p><div class="border-t border-b border-gray-50 py-8 mb-8"><ul id="detailBullets" class="text-sm text-gray-500 space-y-3 italic"></ul></div><a id="detailLink" href="#" target="_blank" class="btn-nyc">Acquire on Amazon</a><button onclick="goHome()" class="mt-10 text-[9px] text-gray-400 uppercase tracking-widest">← Back</button></div></div></div><div id="adminPanel" class="hidden"><div class="max-w-xl mx-auto py-10"><h3 class="font-luxury text-3xl mb-8">Studio Inventory</h3><div id="inventoryList" class="mb-10 max-h-60 overflow-y-auto border-b"></div><div class="grid gap-4"><input type="text" id="dressName" placeholder="Title" class="border-b p-3 text-sm outline-none"><input type="number" id="dressPrice" placeholder="Price" class="border-b p-3 text-sm outline-none"><input type="text" id="dressCategory" placeholder="Category" class="border-b p-3 text-sm outline-none"><input type="text" id="amazonLink" placeholder="Link" class="border-b p-3 text-sm outline-none"><input type="text" id="img1" placeholder="Img 1" class="border-b p-3 text-sm outline-none"><input type="text" id="img2" placeholder="Img 2" class="border-b p-3 text-sm outline-none"><textarea id="dressDesc" placeholder="Features (comma separated)" class="border p-3 h-24 text-sm outline-none"></textarea><button onclick="saveDress()" class="btn-nyc">Save Piece</button><button onclick="closeStudio()" class="text-xs text-gray-400 mt-2">Close</button></div></div></div></main><script>let allProducts=[];async function fetchProducts(){try{const r=await fetch('/api/get-dresses?t='+Date.now());const d=await r.json();return Array.isArray(d)?d:d.result}catch(e){return[]}}async function saveDress(){const d={name:document.getElementById('dressName').value,price:document.getElementById('dressPrice').value,category:document.getElementById('dressCategory').value,images:[document.getElementById('img1').value,document.getElementById('img2').value].filter(u=>u),link:document.getElementById('amazonLink').value,desc:document.getElementById('dressDesc').value,id:Date.now()};await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});window.location.reload()}function toggleAdmin(){if(prompt("Key:")==="rafay1259"){document.getElementById('adminPanel').classList.remove('hidden');document.getElementById('inventoryList').innerHTML=allProducts.map(x=>`<div class="flex justify-between py-2 text-xs border-b"><span>${x.name}</span><button onclick="deleteDress(${x.id})" class="text-red-500">Del</button></div>`).join('')}}function closeStudio(){document.getElementById('adminPanel').classList.add('hidden')}async function deleteDress(id){if(confirm("Delete?")){await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});window.location.reload()}}function renderGrid(p){document.getElementById('productGrid').innerHTML=p.map(i=>`<div class="product-card cursor-pointer" onclick='updateUrlAndShow(${i.id})'><div class="img-container mb-4"><img src="${i.images[0]}" loading="lazy"></div><div class="text-center"><p class="text-[8px] tracking-widest text-[#AD1457] font-bold uppercase mb-1">${i.category}</p><h3 class="text-xs font-semibold tracking-tighter uppercase mb-1">${i.name}</h3><p class="price-tag text-xl">$${i.price}</p></div></div>`).join('')}function updateUrlAndShow(id){window.history.pushState({},'',`?id=${id}`);showDetails(id)}function showDetails(id){const p=allProducts.find(x=>x.id==id);if(!p)return;window.scrollTo(0,0);document.getElementById('mainDetailImg').src=p.images[0];document.getElementById('detailTitle').innerText=p.name;document.getElementById('detailPrice').innerText=`$${p.price}`;document.getElementById('detailCat').innerText=p.category;document.getElementById('detailLink').href=p.link;document.getElementById('detailBullets').innerHTML=(p.desc||"").split(',').map(b=>`<li>— ${b.trim()}</li>`).join('');document.getElementById('homeView').classList.add('hidden');document.getElementById('detailView').classList.remove('hidden')}function goHome(){window.history.pushState({},'',window.location.pathname);document.getElementById('homeView').classList.remove('hidden');document.getElementById('detailView').classList.add('hidden');renderGrid(allProducts)}async function init(){allProducts=await fetchProducts();const i=new URLSearchParams(window.location.search).get('id');if(i)showDetails(i);else renderGrid(allProducts)}init();</script></body></html>
